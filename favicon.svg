<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5d76e;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#c9a227;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#8a6d1f;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="gold-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffe9a0;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#c9a227;stop-opacity:1"/>
    </linearGradient>
    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffe9a0;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#c9a227;stop-opacity:0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Outer ring -->
  <circle cx="32" cy="32" r="29" stroke="url(#gold)" stroke-width="1.2" fill="none" opacity="0.5"/>
  <circle cx="32" cy="32" r="26" stroke="url(#gold)" stroke-width="0.6" fill="none" opacity="0.3"/>
  <!-- Compass rose - four-point star -->
  <polygon points="32,4 35,28 32,32 29,28" fill="url(#gold-light)"/>
  <polygon points="32,60 35,36 32,32 29,36" fill="url(#gold)" opacity="0.7"/>
  <polygon points="4,32 28,29 32,32 28,35" fill="url(#gold)" opacity="0.7"/>
  <polygon points="60,32 36,29 32,32 36,35" fill="url(#gold)" opacity="0.7"/>
  <!-- Diagonal points -->
  <polygon points="12,12 26,26 24,24" fill="url(#gold)" opacity="0.4"/>
  <polygon points="52,12 38,26 40,24" fill="url(#gold)" opacity="0.4"/>
  <polygon points="12,52 26,38 24,40" fill="url(#gold)" opacity="0.4"/>
  <polygon points="52,52 38,38 40,40" fill="url(#gold)" opacity="0.4"/>
  <!-- Inner ring -->
  <circle cx="32" cy="32" r="16" stroke="url(#gold)" stroke-width="0.8" fill="none" opacity="0.5"/>
  <!-- Center -->
  <circle cx="32" cy="32" r="6" fill="url(#center-glow)"/>
  <circle cx="32" cy="32" r="3.5" fill="url(#gold-light)" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="1.5" fill="#0a0e1a"/>
  <!-- Cardinal ticks -->
  <line x1="32" y1="8" x2="32" y2="12" stroke="#c9a227" stroke-width="1.5"/>
  <line x1="32" y1="52" x2="32" y2="56" stroke="#c9a227" stroke-width="1.5"/>
  <line x1="8" y1="32" x2="12" y2="32" stroke="#c9a227" stroke-width="1.5"/>
  <line x1="52" y1="32" x2="56" y2="32" stroke="#c9a227" stroke-width="1.5"/>
</svg>